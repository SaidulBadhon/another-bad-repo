name: Jutsu Security
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  jutsu:
    permissions:
      contents: read     # the scan reads the repository on the runner
      id-token: write    # the report proves which workflow produced it
    uses: jutsuai/code-security/.github/workflows/scan.yml@872060a3faafbe9e841d278b26f4144a9c2edf77
    with:
      report_key: "Gb7TAPduxzrlTvx9usLGlLk4JXGB/YvCcW8JdOmKKl4="   # findings are encrypted to this Jutsu key before they leave the scan job
      api: https://controvertibly-unstrict-leeanna.ngrok-free.dev
