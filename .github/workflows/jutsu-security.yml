name: Jutsu Security
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  jutsu:
    permissions:
      contents: read     # the scan reads the repository on the runner
      id-token: write    # the report proves which workflow produced it
    uses: jutsuai/code-security/.github/workflows/scan.yml@3a2df2b613edfc4346d8d8dadd6a1fcf142c1047
    with:
      api: https://controvertibly-unstrict-leeanna.ngrok-free.dev
