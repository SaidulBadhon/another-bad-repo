name: Jutsu Security
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  jutsu:
    permissions:
      contents: read     # the scan reads the repository on the runner
      id-token: write    # the report proves which workflow produced it
    uses: jutsuai/code-security/.github/workflows/scan.yml@a6a7e3d7d42e93db4fd586cc7fb0d354cbd5a922
    with:
      encrypt_to: "Gb7TAPduxzrlTvx9usLGlLk4JXGB/YvCcW8JdOmKKl4="   # Jutsu's public key: findings are encrypted to it before they leave the scan job
      api: https://controvertibly-unstrict-leeanna.ngrok-free.dev
